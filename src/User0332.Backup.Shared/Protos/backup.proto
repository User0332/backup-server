syntax = "proto3";

option csharp_namespace = "User0332.Backup.Shared";

import "google/protobuf/timestamp.proto";

package backup;

service Backup {
  rpc ChunkExists (ChunkExistsRequest) returns (ChunkExistsReply);
  rpc StoreChunk (stream StoreChunkRequest) returns (StoreChunkReply);
  rpc StoreSnapshot (StoreSnapshotRequest) returns (StoreSnapshotReply);
}

message ChunkExistsRequest {
  uint32 hash = 1;
}

message ChunkExistsReply {
  bool exists = 1;
}

message StoreChunkRequest {
	oneof payload {
		uint32 chunk_hash = 1;
		ChunkOfChunk chunk_of_chunk = 2;
	}
}

message ChunkOfChunk {
	bytes data = 1;
	uint32 transit_hash = 2;
}

message StoreChunkReply {
	bool success = 1;
	string error = 2;
}

message StoreSnapshotRequest {
	string snapshot_id = 1;
	string client_id = 2;
	string job_id = 3;
	repeated uint32 chunks = 4;
	bytes encrypted_manifest = 5;
	uint32 manifest_transit_hash = 6;
	google.protobuf.Timestamp created_at = 7;
	google.protobuf.Timestamp expires_at = 8;
}

message StoreSnapshotReply {
	bool success = 1;
	string error = 2;
}